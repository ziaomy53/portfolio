<style>
:root{--bg:#08080c;--tx:#f2efeb;--mu:#a09c9a;--ac:#8b6cff;--ln:rgba(242,239,235,.14);--card:#101016;--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080c;--tx:#f2efeb}}
:root[data-theme="dark"]{--bg:#08080c;--tx:#f2efeb}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 Manrope,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{margin:0;font-weight:400}
.disp{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.hand{font-family:Caveat,cursive;color:var(--ac);font-size:1.5rem}
.eyebrow{color:var(--ac);font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
section{padding:96px 0;border-top:1px solid var(--ln)}
.sec-h{font-size:clamp(2.4rem,7vw,4.6rem);margin:10px 0 40px}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--ac);z-index:70}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(8,8,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.logo{font-family:Anton,sans-serif;font-size:1.35rem;letter-spacing:.04em}.logo b{color:var(--ac);font-weight:400}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:10px 14px;color:var(--mu);font-size:.9rem;font-weight:500;position:relative}
nav a.on,nav a:hover{color:var(--tx)}nav a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--ac)}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:99px;border:1px solid var(--ln);background:none;color:var(--tx);font:700 .9rem Manrope,sans-serif;cursor:pointer;transition:transform .4s var(--ease),background .3s,border-color .3s}
.btn:hover{border-color:var(--ac);transform:translateY(-2px)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0b0818}.btn.pri:hover{background:#a48cff}
.btn.sm{padding:0 14px;font-size:.8rem}
#menu{display:none}
.hero{padding:70px 0 90px;border:0;min-height:calc(100svh - 68px);display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(60% 55% at 78% 42%,rgba(139,108,255,.18),transparent 70%),radial-gradient(40% 40% at 8% 90%,rgba(139,108,255,.08),transparent 70%)}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center;position:relative;z-index:1;width:100%}
.hero h1{font-size:clamp(3.6rem,10.5vw,8.6rem);margin:14px 0 18px}
.hero h1 span{color:var(--ac)}
.role{color:var(--mu);font-weight:500;margin:0 0 20px}
.intro{max-width:560px;color:#d3cfcb;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding:0;list-style:none}
.chips li{border:1px solid var(--ln);border-radius:99px;padding:5px 14px;font-size:.82rem;color:var(--mu)}
.ph{position:relative;aspect-ratio:4/5;border-radius:220px 220px 18px 18px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 0 0 10px rgba(139,108,255,.08)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:14px;bottom:14px;background:rgba(8,8,12,.8);border:1px solid var(--ln);border-radius:99px;padding:6px 14px;font-size:.78rem}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.filters button{background:none;border:0;color:var(--mu);font:700 .85rem Manrope,sans-serif;padding:10px 16px;min-height:44px;cursor:pointer;position:relative}
.filters button[aria-pressed=true]{color:var(--tx)}
.filters button[aria-pressed=true]::after{content:"";position:absolute;left:16px;right:16px;bottom:6px;height:2px;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--tx);cursor:pointer;font:inherit;transition:transform .5s var(--ease),border-color .3s}
.card:hover{transform:translateY(-6px);border-color:var(--ac)}
.card h3{font-family:Anton,sans-serif;font-size:1.7rem;text-transform:uppercase;line-height:1.05}
.card p{margin:0;color:var(--mu);font-size:.95rem;flex:1}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:700}
.more{font-weight:700;font-size:.85rem}
dialog{width:min(640px,calc(100% - 32px));max-height:88svh;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:34px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h3{font-family:Anton,sans-serif;font-size:2.2rem;text-transform:uppercase;margin:8px 0 14px}
dialog dt{color:var(--ac);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:16px}
dialog dd{margin:4px 0 0;color:#d3cfcb}
.x{float:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.two h3,.sub{font-family:Anton,sans-serif;text-transform:uppercase;font-size:1.5rem;margin:0 0 14px}
.skill{padding:14px 0;border-bottom:1px solid var(--ln)}.skill b{display:block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}.skill span{color:#d3cfcb}
.edu{padding:14px 0;border-bottom:1px solid var(--ln)}.edu b{display:block}.edu span{color:var(--mu);font-size:.92rem}
details{border-top:1px solid var(--ln);padding:6px 0}
summary{list-style:none;cursor:pointer;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;font-weight:700}
summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:1.6rem;color:var(--ac)}details[open] summary::after{content:"–"}
details ul{margin:0 0 18px;padding-left:20px;color:#d3cfcb}details li{margin-bottom:8px}
.dim{color:var(--mu);font-weight:400;font-size:.9rem}
form{display:grid;gap:14px;max-width:560px}
label{display:grid;gap:6px;font-size:.85rem;font-weight:700}
input,textarea{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;font:inherit;min-height:44px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.big{font-size:clamp(1.3rem,4vw,2.2rem);font-family:Anton,sans-serif;letter-spacing:.02em;word-break:break-all}
footer{border-top:1px solid var(--ln);padding:32px 0;color:var(--mu);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.nomo .rv{opacity:1;transform:none;transition:none}.nomo *{scroll-behavior:auto!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media (max-width:860px){
 .hero .wrap,.two{grid-template-columns:1fr}.ph{max-width:340px;order:-1}
 #menu{display:inline-flex}
 nav{position:absolute;left:0;right:0;top:68px;background:var(--bg);border-bottom:1px solid var(--ln);display:none}
 nav.open{display:block}nav ul{flex-direction:column;padding:10px 24px}
 .hcta{display:none}section{padding:72px 0}
}

/* hero animated background: drifting neural-network particles; pauses with the Motion toggle */
(()=>{const cv=$("#bg"),cx=cv.getContext("2d"),hero=cv.parentElement,dpr=Math.min(devicePixelRatio||1,2),fine=matchMedia("(pointer:fine)").matches;
 let W=0,H=0,P=[],vis=true,mx=-999,my=-999;
 function draw(){cx.clearRect(0,0,W,H);const L=Math.min(150,W/5);
  for(let i=0;i<P.length;i++){const a=P[i];for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<L){cx.strokeStyle="rgba(139,108,255,"+(.32*(1-d/L))+")";cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}}
  for(const p of P){cx.fillStyle="rgba(242,239,235,.55)";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}}
 function init(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.round(Math.min(90,Math.max(28,W*H/16000)));
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:1+Math.random()*1.6}));draw()}
 function step(){for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  if(fine){const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy);if(d<140&&d>1){p.x-=dx/d*.7;p.y-=dy/d*.7}}}}
 function tick(){if(vis&&!document.body.classList.contains("nomo")){step();draw()}requestAnimationFrame(tick)}
 hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
 hero.addEventListener("pointerleave",()=>{mx=my=-999});
 new IntersectionObserver(es=>{vis=es[0].isIntersecting}).observe(hero);
 new ResizeObserver(init).observe(hero);tick();
})();

/* reveals, scroll progress, active section */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el));
const links=[...document.querySelectorAll("nav a")];
const so=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)links.forEach(a=>a.classList.toggle("on",a.dataset.s==x.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
secs.forEach(([id])=>so.observe($("#"+id)));
const pg=$("#prog");addEventListener("scroll",()=>{const h=document.documentElement;pg.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+"%"},{passive:true});
</script>
